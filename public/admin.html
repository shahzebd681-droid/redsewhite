<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>RedseWhite Admin</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Never allow the login screen and dashboard to appear together. */
  [hidden] { display: none !important; }
</style>
</head>
<body class="admin-page">
  <div id="login" class="login">
    <div class="card login-card">
      <div class="brand"><b>REDSE</b>WHITE</div>
      <h1>Admin Login</h1>
      <p class="muted">Secure access to your payment control center.</p>
      <form id="loginForm" autocomplete="on">
        <label>Username<input id="username" name="username" autocomplete="username" placeholder="Username" required></label>
        <label>Password<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required></label>
        <button class="btn full" type="submit">Login</button>
      </form>
    </div>
  </div>

  <div id="panel" hidden>
    <header class="admin-header">
      <div class="logo"><b>REDSE</b>WHITE <span>Admin</span></div>
      <button id="logout" class="btn btn-small" type="button">Logout</button>
    </header>

    <main class="section admin-main">
      <div class="stats">
        <div><span>Total</span><b id="totalStat">0</b></div>
        <div><span>Pending</span><b id="pendingStat">0</b></div>
        <div><span>Confirmed</span><b id="confirmedStat">0</b></div>
        <div><span>Rejected</span><b id="rejectedStat">0</b></div>
      </div>

      <section class="card">
        <h2>Payment Settings</h2>
        <p class="muted">Har payment method ko alag se save kar sakte ho.</p>
        <div id="settingsCards" class="settings-grid"></div>
      </section>

      <section class="card">
        <h2>Contact Settings</h2>
        <div class="two-col">
          <label>Telegram<input id="telegram" placeholder="Telegram username/link"></label>
          <label>WhatsApp<input id="whatsapp" placeholder="WhatsApp number/link"></label>
        </div>
        <button class="btn" id="saveContacts" type="button">Save Contacts</button>
      </section>

      <section class="card">
        <div class="section-title-row">
          <div>
            <h2>Transactions</h2>
            <p class="muted">Customer payments ko yahan manually verify karo.</p>
          </div>
          <button id="refreshTx" class="btn btn-secondary" type="button">↻ Refresh</button>
        </div>
        <div id="txs" class="transactions">Loading...</div>
      </section>
    </main>
  </div>

<script src="admin.js?v=2"></script>
</body>
</html>
