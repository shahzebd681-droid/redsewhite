<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RedseWhite Admin</title><link rel="stylesheet" href="style.css"></head><body><div id="login" class="login"><div class="card"><h1>REDSEWHITE</h1><h2>Admin Login</h2><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button class="btn">Login</button></form></div></div><div id="panel" hidden><header><div><b>REDSE</b>WHITE Admin</div><button id="logout">Logout</button></header><main class="section"><div class="stats"><div>Total <b id="totalStat">0</b></div><div>Pending <b id="pendingStat">0</b></div><div>Confirmed <b id="confirmedStat">0</b></div><div>Rejected <b id="rejectedStat">0</b></div></div><section class="card"><h2>Payment Settings — 5 Separate Cards</h2><p class="muted">Har payment method ko alag se save kar sakte ho.</p><div id="settingsCards"></div></section><section class="card"><h2>Contact Settings</h2><label>Telegram<input id="telegram"></label><label>WhatsApp<input id="whatsapp"></label><button class="btn" onclick="saveContacts()">Save Contacts</button></section><section class="card"><h2>Transactions</h2><button onclick="loadTxs()">↻ Refresh</button><div id="txs"></div></section></main></div><script src="admin.js"></script></body></html>
